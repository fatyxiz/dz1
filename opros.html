    <form id="surveyForm">
        <label for="catType"><h4>Какой вид кошек вы любите больше всего и почему?</h4></label><br>

        <input type="text" id="petInfo" name="pet_info" placeholder="Здесь можете писать."><br>

        <h4>Вам понравился наш сайт?</h4>
        <div>
            <input type="radio" id="option1" name="liked_site" value="1">
            <label for="option1"> Да!</label>

            <input type="radio" id="option2" name="liked_site" value="2">
            <label for="option2">Нет!</label>
        </div>

        <button type="submit" id="submitBtn"><h2>Отправить</h2></button>
    </form>

    <p id="result"></p>
